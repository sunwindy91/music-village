<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MusicCore 独立测试 · module-audio</title>
<style>
  body { font-family:"Microsoft YaHei",sans-serif; background:#0a0e1f; color:#eef2ff;
    padding:24px; }
  button { background:#161d3d; color:#ffc964; border:1px solid #2a3560; border-radius:10px;
    padding:10px 18px; margin:4px; font-size:1rem; cursor:pointer; }
  button:hover { border-color:#ffc964; }
  h2 { color:#ffc964; }
</style>
</head>
<body>
<h1>🎵 MusicCore 测试页（module-audio 独立可开）</h1>
<p style="color:#93a0c8">契约接口：playNote / playMelody / playChord / stopAll</p>
<div>
  <button onclick="MusicCore.playNote(60)">do</button>
  <button onclick="MusicCore.playNote(64)">mi</button>
  <button onclick="MusicCore.playNote(67)">sol</button>
  <button onclick="MusicCore.playNote(72)">高 do</button>
</div>
<div>
  <button onclick="MusicCore.playMelody([{midi:60,dur:0.4},{midi:62,dur:0.4},{midi:64,dur:0.4},{midi:67,dur:0.8}])">do-re-mi-sol</button>
  <button onclick="MusicCore.playChord(60,'major')">C 大三和弦</button>
  <button onclick="MusicCore.playChord(60,'minor')">C 小三和弦</button>
  <button onclick="MusicCore.stopAll()">停止</button>
</div>
<script src="music-core.js"></script>
</body>
</html>
