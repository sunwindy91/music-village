<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>大山里的音乐课 · 音乐寻宝</title>
  <meta name="description" content="给山区孩子的 AI 陪伴式乐理寻宝游戏 —— 把真实的音符、节奏、旋律，变成山谷里看得见、摸得着、玩得懂的宝藏。">
  <meta name="theme-color" content="#bfe3ff">
  <!-- 字体：非阻塞加载（避免 Google Fonts 卡住页面渲染，先系统字体后替换） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="styles/main_c20260812h.css?v=20260813f">
  <!-- 音乐引擎 / 乐理引擎 / 记谱引擎（本地优先，离线可用） -->
  <script src="vendor/tonal.min.js?v=1"></script>
  <script src="vendor/tone.js?v=1"></script>
  <script src="vendor/vexflow.js?v=1"></script>
</head>
<body>

  <!-- ══════════ 启动 Splash：太阳升起 · 晓声打招呼 ══════════ -->
  <section id="view-splash" class="view" aria-label="开场">
    <div class="splash">
      <div class="splash-sky" aria-hidden="true">
        <span class="sun"></span>
        <span class="cloud cloud-1"></span>
        <span class="cloud cloud-2"></span>
        <span class="cloud cloud-3"></span>
        <svg class="splash-range" viewBox="0 0 400 260" preserveAspectRatio="none" aria-hidden="true">
          <path class="mountain back" d="M0 260 L0 150 Q70 60 160 150 Q220 90 300 160 Q360 120 400 170 L400 260 Z"/>
          <path class="mountain mid" d="M0 260 L0 200 Q90 130 210 205 Q300 150 400 225 L400 260 Z"/>
          <path class="mountain front" d="M0 260 L0 232 Q140 170 260 238 Q330 210 400 242 L400 260 Z"/>
        </svg>
      </div>
      <div class="splash-content">
        <div class="xs-holder" id="splash-xs"></div>
        <h1 class="splash-title">大山里的音乐课</h1>
        <p class="splash-tag">没有音乐老师的山里，孩子也能学会真乐理</p>
        <button class="btn btn-gold splash-go" type="button">开始寻宝</button>
        <p class="splash-skip" role="button" tabindex="0" data-skip>点这里跳过 →</p>
      </div>
    </div>
  </section>

  <!-- ══════════ 山谷主场景 · 寻宝地图 ══════════ -->
  <section id="view-map" class="view" aria-label="山谷寻宝地图">
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">大山里的音乐课</span>
      </div>
      <div class="topbar-right">
        <div class="points-pill" aria-live="polite">
          <span class="points-icon" aria-hidden="true">♪</span>
          <span class="points-num" id="map-points">0</span>
        </div>
        <button class="icon-btn" id="btn-reset" type="button" aria-label="重新开始" title="重新开始">↺</button>
      </div>
    </div>

    <div class="map-wrap">
      <div class="map-scene" id="map-scene">
        <!-- 山谷背景（SVG 手绘风） -->
        <svg class="map-bg" viewBox="0 0 400 640" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <linearGradient id="mapSky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#dceffb"/>
              <stop offset="0.55" stop-color="#bfe3ff"/>
              <stop offset="1" stop-color="#e8f3d8"/>
            </linearGradient>
            <linearGradient id="mntBack" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#9cc3b4"/>
              <stop offset="1" stop-color="#7fae9c"/>
            </linearGradient>
            <linearGradient id="mntMid" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#7fae9c"/>
              <stop offset="1" stop-color="#5e9279"/>
            </linearGradient>
            <linearGradient id="mntFront" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#5e9279"/>
              <stop offset="1" stop-color="#3e7d5e"/>
            </linearGradient>
            <linearGradient id="meadowGrass" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#8fc49a"/>
              <stop offset="1" stop-color="#5e9279"/>
            </linearGradient>
            <linearGradient id="riverGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#b7ddf5"/>
              <stop offset="1" stop-color="#8ec3e8"/>
            </linearGradient>
          </defs>

          <!-- 天空 -->
          <rect width="400" height="640" fill="url(#mapSky)"/>
          <!-- 太阳 -->
          <circle cx="330" cy="72" r="30" fill="#f6dc9a"/>
          <circle cx="330" cy="72" r="22" fill="#f3ce7e"/>
          <!-- 云 -->
          <g class="map-clouds">
            <ellipse cx="90"  cy="80" rx="46" ry="16" fill="#ffffff" opacity="0.85"/>
            <ellipse cx="118" cy="72" rx="30" ry="13" fill="#ffffff" opacity="0.85"/>
            <ellipse cx="250" cy="140" rx="40" ry="13" fill="#ffffff" opacity="0.7"/>
          </g>
          <!-- 远山 -->
          <path d="M0 300 L0 168 Q80 96 168 176 Q252 112 330 190 Q370 168 400 196 L400 300 Z" fill="url(#mntBack)"/>
          <!-- 中山 -->
          <path d="M0 392 L0 268 Q110 190 226 282 Q320 210 400 300 L400 392 Z" fill="url(#mntMid)"/>
          <!-- 山脊=五线谱意象（贴在山腰的柔线） -->
          <g class="stave-hint" opacity="0.55">
            <path d="M0 330 L400 330" stroke="#fff8ec" stroke-width="3" stroke-dasharray="0.1 14" stroke-linecap="round"/>
            <path d="M0 346 L400 346" stroke="#fff8ec" stroke-width="3" stroke-dasharray="0.1 14" stroke-linecap="round"/>
            <path d="M0 362 L400 362" stroke="#fff8ec" stroke-width="3" stroke-dasharray="0.1 14" stroke-linecap="round"/>
            <path d="M0 378 L400 378" stroke="#fff8ec" stroke-width="3" stroke-dasharray="0.1 14" stroke-linecap="round"/>
            <path d="M0 394 L400 394" stroke="#fff8ec" stroke-width="3" stroke-dasharray="0.1 14" stroke-linecap="round"/>
          </g>
          <!-- 前山 / 谷地 -->
          <path d="M0 470 L0 400 Q110 330 226 420 Q320 348 400 436 L400 470 Z" fill="url(#mntFront)"/>
          <!-- 溪水 / 草地 -->
          <path d="M0 470 Q200 410 400 470 L400 640 L0 640 Z" fill="url(#meadowGrass)"/>
          <path class="river" d="M178 408 C 168 452 208 478 200 520 C 190 566 232 596 214 640" fill="none" stroke="url(#riverGrad)" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
          <path class="river-line" d="M178 408 C 168 452 208 478 200 520 C 190 566 232 596 214 640" fill="none" stroke="#dff0fb" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
          <!-- 寻宝小路（实线 · 流程动线） -->
          <path id="trail" d="M200 150 C 120 190 150 260 205 300 C 260 340 250 400 196 430 C 150 456 160 520 208 548 C 236 566 232 600 214 630" fill="none" stroke="#f3d9a4" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
          <path id="trail-core" d="M200 150 C 120 190 150 260 205 300 C 260 340 250 400 196 430 C 150 456 160 520 208 548 C 236 566 232 600 214 630" fill="none" stroke="#c98a5e" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
          <!-- 底部点缀小花 -->
          <g class="flowers" fill="#eec2c9" opacity="0.9">
            <circle cx="60" cy="560" r="5"/>
            <circle cx="66" cy="552" r="5"/>
            <circle cx="63" cy="556" r="3" fill="#f3e2a4"/>
            <circle cx="330" cy="600" r="6"/>
            <circle cx="338" cy="592" r="6"/>
            <circle cx="334" cy="596" r="3.5" fill="#f3e2a4"/>
            <circle cx="120" cy="620" r="5"/>
          </g>
        </svg>

        <!-- 晓声 -->
        <div class="xs-holder map-xs" id="map-xs"></div>

        <!-- 背景漂浮音符（程序化动画层，一致性不变） -->
        <div class="note-float" id="note-float" aria-hidden="true">
          <span class="nf" style="left:12%;top:16%;animation-delay:0s;font-size:22px">♪</span>
          <span class="nf" style="left:80%;top:24%;animation-delay:1.1s;font-size:18px">♫</span>
          <span class="nf" style="left:22%;top:50%;animation-delay:2s;font-size:20px">♪</span>
          <span class="nf" style="left:72%;top:58%;animation-delay:.6s;font-size:16px">♩</span>
          <span class="nf" style="left:44%;top:10%;animation-delay:1.6s;font-size:24px">♬</span>
          <span class="nf" style="left:64%;top:38%;animation-delay:2.6s;font-size:15px">♪</span>
        </div>

        <!-- 节点连线层（流程动线：通关逐段点亮，金=已通/浅金=解锁/灰=未解锁） -->
        <svg class="map-links" id="map-links" viewBox="0 0 400 640" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none"></svg>

        <!-- 地点节点（JS 按 MV.locations 生成画布式圆形节点 · 序号徽章=流程模式） -->
        <div class="locs" id="map-locs"></div>

        <!-- 萤火层 -->
        <div class="firefly-layer" id="map-fireflies" aria-hidden="true"></div>

        <!-- 地图底部提示 -->
        <div class="map-footer" id="map-footer"></div>
      </div>
    </div>
  </section>

  <!-- ══════════ 关卡舞台 ══════════ -->
  <section id="view-stage" class="view" aria-label="关卡舞台">
    <div class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="stage-back" type="button" aria-label="返回地图">←</button>
        <span class="topbar-title" id="stage-title">关卡</span>
      </div>
      <div class="topbar-right">
        <div class="points-pill" aria-live="polite">
          <span class="points-icon" aria-hidden="true">♪</span>
          <span class="points-num" id="stage-points">0</span>
        </div>
      </div>
    </div>

    <div class="stage">
      <!-- 晓声引导区（每个关卡共用） -->
      <div class="stage-xs">
        <div class="xs-holder stage-xs-holder" id="stage-xs"></div>
      </div>

      <div class="stage-body" id="stage-body">
        <!-- 关卡舞台内容由 JS 注入 -->
      </div>
    </div>
  </section>

  <!-- ══════════ 通关庆祝 ══════════ -->
  <section id="view-celebrate" class="view" aria-label="通关庆祝">
    <div class="celebrate">
      <div class="confetti" id="confetti" aria-hidden="true"></div>
      <div class="xs-holder celebrate-xs" id="celebrate-xs"></div>
      <h2 class="celebrate-title" id="celebrate-title">通关啦！</h2>
      <p class="celebrate-line" id="celebrate-line"></p>
      <div class="celebrate-song hidden" id="celebrate-song" aria-live="polite">
        <div class="celebrate-song-name" id="celebrate-song-name"></div>
        <p class="celebrate-song-lyrics" id="celebrate-song-lyrics"></p>
      </div>
      <div class="celebrate-points" id="celebrate-points"></div>
      <button class="btn btn-primary" id="celebrate-next" type="button">回到山谷</button>
    </div>
  </section>

  <!-- ══════════ 我的音乐会（作品墙 · P1） ══════════ -->
  <section id="view-concert" class="view" aria-label="我的音乐会">
    <div class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="concert-back" type="button" aria-label="返回地图">←</button>
        <span class="topbar-title">我的音乐会</span>
      </div>
      <div class="topbar-right">
        <div class="points-pill" aria-live="polite">
          <span class="points-icon" aria-hidden="true">♪</span>
          <span class="points-num" id="concert-points">0</span>
        </div>
      </div>
    </div>
    <div class="concert" id="concert-body"></div>
  </section>

  <!-- ══════════ 五线谱出口（覆盖面板） ══════════ -->
  <div id="staff-overlay" class="overlay" hidden>
    <div class="staff-panel">
      <div class="staff-panel-head">
        <h2 class="staff-panel-title">你的第一首谱</h2>
        <button class="icon-btn" id="staff-close" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="staff-xs">
        <div class="xs-holder" id="staff-xs"></div>
      </div>
      <div class="staff-canvas" id="staff-canvas" aria-label="五线谱渲染区"></div>
      <div class="staff-actions">
        <button class="btn btn-primary" id="staff-play" type="button" aria-label="播放这段旋律">▶ 听一听</button>
        <button class="btn btn-gold" id="staff-save" type="button">保存图片</button>
        <button class="btn btn-ghost" id="staff-midi" type="button">存 MIDI</button>
      </div>
      <p class="staff-note">乐理小贴士：五条线、四个间，音符住在线和间里。你的曲子，现在有家了。</p>
    </div>
  </div>

  <!-- 作品播放完 · 晓声给山里小朋友的鼓励 -->
  <div id="encourage-overlay" class="overlay encourage-overlay" hidden>
    <div class="encourage-card">
      <div class="xs-holder encourage-xs" id="encourage-xs"></div>
      <p class="encourage-text" id="encourage-text"></p>
      <button class="btn btn-gold" id="encourage-close" type="button">收下啦！</button>
    </div>
  </div>

  <!-- 问问晓声（本地规则问答 · 乐理与陪伴） -->
  <div id="qa-overlay" class="overlay qa-overlay" hidden>
    <div class="qa-panel">
      <div class="qa-head">
        <h2>问问晓声</h2>
        <button class="icon-btn" id="qa-close" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="xs-holder qa-xs" id="qa-xs"></div>
      <div class="qa-chat" id="qa-chat"></div>
      <div class="qa-hints">可以问：音高 · 节奏 · 五线谱 · 下一关去哪</div>
      <div class="qa-input">
        <input id="qa-input" type="text" placeholder="问问我，比如：什么是音高？" aria-label="问晓声问题">
        <button class="icon-btn qa-mic" id="qa-mic" type="button" aria-label="语音提问" title="语音提问">🎤</button>
        <button class="btn btn-gold" id="qa-send" type="button">问</button>
      </div>
    </div>
  </div>

  <!-- 积分飘字 -->
  <div id="points-toast" class="points-toast" aria-hidden="true"></div>

  <!-- 首页聚类选择页样式（内嵌，避免 CSS 文件线改动） -->
  <style>
    #map-locs { position: absolute; inset: 0; z-index: 22; pointer-events: none; }
    .map-node { pointer-events: auto; width: 92px; height: 92px; border-radius: 50%; border: 3px solid #fff8ec; overflow: hidden; background: #fffdf7; cursor: pointer; padding: 0; animation: ccFloat 3.4s ease-in-out infinite; touch-action: manipulation; box-shadow: 0 4px 14px rgba(93,74,50,.25); }
    .map-node:nth-child(1) { animation-delay: 0s; }
    .map-node:nth-child(2) { animation-delay: .4s; }
    .map-node:nth-child(3) { animation-delay: .8s; }
    .map-node:nth-child(4) { animation-delay: 1.2s; }
    .map-node:nth-child(5) { animation-delay: 1.6s; }
    .map-node.completed { box-shadow: 0 0 18px rgba(232,176,75,.6); }
    .map-node .step-num { position:absolute; top:-7px; left:-7px; width:27px; height:27px; border-radius:50%; background:#e8b04b; color:#4d330f; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; border:2px solid #fff8ec; box-shadow:0 2px 6px rgba(93,74,50,.32); z-index:2; pointer-events:none; line-height:1; }
    .map-node.locked .step-num { background:#c7cfc6; color:#3f4c42; }
    .map-node.completed .step-num { background:#f6d693; color:#5b3a10; }
    .map-node .step-lock { position:absolute; top:-4px; right:-4px; width:26px; height:26px; background:#fff8ec; border-radius:50%; font-size:15px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(93,74,50,.3); z-index:2; }
    /* 鼓励语 overlay（作品播放完 · 晓声对山里孩子说话） */
    .encourage-overlay { background: rgba(31,74,55,.45); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
    .encourage-card { width: min(88vw, 420px); background: linear-gradient(165deg,#fffdf7,#f1f7e9); border-radius: 22px; padding: 20px 20px 18px; text-align: center; box-shadow: 0 16px 40px rgba(31,74,55,.35); }
    .encourage-xs { width: 42%; margin: 0 auto; }
    .encourage-text { font-size: 16.5px; line-height: 1.8; color: #2f5d47; font-weight: 600; margin: 4px 0 16px; }
    /* 问问晓声（问答面板） */
    .qa-overlay { background: rgba(31,74,55,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 60; padding: 16px; }
    .qa-panel { width: min(92vw, 460px); background: #fffdf7; border-radius: 22px; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(31,74,55,.3); }
    .qa-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #efe6d2; }
    .qa-head h2 { margin: 0; font-size: 18px; color: #2f5d47; }
    .qa-xs { width: 30%; margin: 0 auto; }
    .qa-chat { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 110px; max-height: 34vh; }
    .qa-bubble { max-width: 78%; padding: 8px 12px; border-radius: 14px; font-size: 14.5px; line-height: 1.6; word-break: break-word; }
    .qa-bubble.xs { align-self: flex-start; background: #f1f7e9; color: #2f5d47; border-bottom-left-radius: 4px; }
    .qa-bubble.me { align-self: flex-end; background: #e8f0fb; color: #33527a; border-bottom-right-radius: 4px; }
    .qa-hints { font-size: 12px; color: #8a7a5f; text-align: center; padding: 0 12px 8px; }
    .qa-input { display: flex; gap: 8px; padding: 10px 12px 14px; border-top: 1px solid #efe6d2; }
    .qa-input input { flex: 1; min-width: 0; border: 2px solid #e3d9c2; border-radius: 12px; padding: 10px 12px; font-size: 15px; background: #fffdf7; }
    .qa-input input:focus { outline: none; border-color: #e8b04b; }
    .qa-input .qa-mic { flex: 0 0 auto; width: 46px; height: 46px; font-size: 20px; border-radius: 12px; }
    #map-footer { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    @keyframes ccFloat { 0%,100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.03); } }
    .xs-dragging { animation: none !important; }
    @media (max-width: 640px) { .map-node { width: 76px; height: 76px; } }
    .note-float { position: absolute; inset: 0; pointer-events: none; z-index: 15; }
    .nf { position: absolute; color: #e8b04b; opacity: .55; animation: nfFloat 6s ease-in-out infinite; text-shadow: 0 0 8px rgba(232,176,75,.4); }
    @keyframes nfFloat { 0%,100% { transform: translateY(0) rotate(0deg); opacity: .35; } 50% { transform: translateY(-20px) rotate(10deg); opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { .map-node, .nf { animation: none; } }
  </style>

  <script src="config.js?v=20260813f"></script>
  <script src="shared/lines.js?v=20260813f"></script>
  <script src="shared/levels.js?v=20260813f"></script>
  <script src="modules/audio/music-core.js?v=20260813f"></script>
  <script src="modules/voice/voice-core.js?v=20260813f"></script>
  <script src="modules/notation/staff.js?v=20260813f"></script>
  <script src="app.js?v=20260813f"></script>
</body>
</html>
